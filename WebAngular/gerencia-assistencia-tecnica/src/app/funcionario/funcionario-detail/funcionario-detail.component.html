<mat-toolbar>
  <span>{{ tela }} - {{service.form.controls['id'].value?"Editar":"Novo"}}</span>
  <span class="fill-remaining-space"></span>
  <button class="btn-dialog-close" mat-stroked-button (click)="onClose()" tabIndex="-1"><mat-icon>clear</mat-icon></button>
</mat-toolbar>
<form [formGroup]="service.form" class="normal-form" (submit)="onSubmit()">
  <mat-grid-list cols="2" rowHeight="80px">
      
    <mat-grid-tile>
        <div class="controles-container">
            <input type="hidden" formControlName="id">                     
      
          <mat-form-field>
            <input formControlName="nome" matInput placeholder="Nome*">
            <mat-error>O campo Nome é obrigatório</mat-error>
          </mat-form-field> 
        </div>
      </mat-grid-tile>       

          <mat-grid-tile>
              <div class="controles-container">
          <mat-form-field>
            <input formControlName="sobrenome" matInput placeholder="Sobrenome*">
            <mat-error>O campo Sobrenome é obrigatório</mat-error>
          </mat-form-field>        
        </div>
     </mat-grid-tile>

     <mat-grid-tile>
      <div class="controles-container">
        <mat-form-field>
          <input formControlName="email" matInput placeholder="Email*">
          <mat-error>O campo Email é obrigatório</mat-error>
        </mat-form-field>
      </div>
    </mat-grid-tile>

       <mat-grid-tile>
          <div class="controles-container">
          <mat-form-field>
            <input formControlName="cpf" matInput placeholder="CPF">
            <mat-error>Máximo de 11 caracteres</mat-error>
          </mat-form-field>  
        </div>
      </mat-grid-tile>      

      <mat-grid-tile>
          <div class="controles-container">
          <mat-form-field>
            <input formControlName="rg" matInput placeholder="RG">
            <!-- <mat-error>O campo RG é obrigatório</mat-error> -->
          </mat-form-field>
        </div>
      </mat-grid-tile>
             
      <mat-grid-tile>
          <div class="controles-container">
          <mat-form-field>
            <input formControlName="telefone" matInput placeholder="Telefone">
            <!-- <mat-error>O campo Telefone é obrigatório</mat-error> -->
          </mat-form-field>
        </div>
      </mat-grid-tile>

          <mat-grid-tile>
              <div class="controles-container">
          <mat-form-field>
              <input formControlName="celular" matInput placeholder="Celular">
              <!-- <mat-error>O campo Celular é obrigatório</mat-error> -->
            </mat-form-field>
        </div>
      </mat-grid-tile>
        
      <mat-grid-tile  colspan="2">
          <div class="controles-container buttons">
          <div class="button-row">
            <button mat-raised-button color="primary" type="submit" [disabled]="service.form.invalid">Salvar</button>
            <button mat-raised-button color="warn" (click)="onClear()">Limpar</button>
          </div>
        </div>
      </mat-grid-tile>
</mat-grid-list>
</form>
