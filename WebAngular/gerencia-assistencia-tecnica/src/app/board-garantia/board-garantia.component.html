<div class="container">

  <div class="minha">
    <div cdkDropList #minha="cdkDropList" [cdkDropListConnectedTo]="[confirmados]" [cdkDropListData]="myList"
      class="col-lg-6" (cdkDropListDropped)="drop($event)">
      <ul class="list-group">
        <li class="list-group-item minha-header">
          <h3>Aprovados</h3>
        </li>
        @for (p of myList ; track p) {
          <li class="list-group-item" cdkDrag>{{p.name}}</li>
        }
      </ul>
    </div>
  </div>

  <div class="confirmados">
    <div cdkDropList #confirmados="cdkDropList" [cdkDropListData]="confirmList" [cdkDropListConnectedTo]="[minha, saida]"
      (cdkDropListDropped)="drop($event)" class="col-lg-6">
      <ul class="list-group">
        <li class="list-group-item active confirmados-header">
          <h3>Em Manutenção</h3>
        </li>
        @for (p of confirmList; track p) {
          <li class="list-group-item" cdkDrag>
            <img [src]="p.image" class="img-person">
          {{p.name}}</li>
        }
      </ul>
    </div>
  </div>

  <div class="saida">
    <div cdkDropList #saida="cdkDropList" [cdkDropListData]="saidaList" [cdkDropListConnectedTo]="[confirmados]"
      (cdkDropListDropped)="drop($event)" class="col-lg-6">
      <ul class="list-group">
        <li class="list-group-item active saidaHeader">
          <h3>Aguardando Saída</h3>
        </li>
        @for (p of saidaList; track p) {
          <li class="list-group-item" cdkDrag>
            <img [src]="p.image" class="img-person">
          {{p.name}}</li>
        }
      </ul>
    </div>
  </div>


</div>
